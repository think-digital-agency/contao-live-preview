services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    ThinkDigital\ContaoLivePreview\:
        resource: '../../*'
        exclude:
            - '../../ContaoManager/'
            - '../../DependencyInjection/'
            - '../../ContaoLivePreviewBundle.php'

    # Explicit alias so third-party bundles can override the resolver by
    # rebinding this interface in their own services.yaml.
    ThinkDigital\ContaoLivePreview\Service\PreviewUrlResolverInterface:
        alias: ThinkDigital\ContaoLivePreview\Service\PreviewUrlResolver
