services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Vendor\ContaoLivePreviewBundle\:
        resource: '../../*'
        exclude:
            - '../../ContaoManager/'
            - '../../DependencyInjection/'
            - '../../ContaoLivePreviewBundle.php'

    # Explicit alias so third-party bundles can override the resolver by
    # rebinding this interface in their own services.yaml.
    Vendor\ContaoLivePreviewBundle\Service\PreviewUrlResolverInterface:
        alias: Vendor\ContaoLivePreviewBundle\Service\PreviewUrlResolver
